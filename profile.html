<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - الملف الشخصي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="lang-toggle-btn" onclick="i18n.toggle()">EN</button>
  <button class="theme-toggle-btn" onclick="App.toggleTheme()">🌙</button>
  <div class="profile-screen">
    <div class="profile-header-card">
      <div class="profile-avatar">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="14" r="7" stroke="white" stroke-width="2" fill="none"/>
          <path d="M8 36c0-6.6 5.4-12 12-12s12 5.4 12 12" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="profile-name" data-i18n="profile.name">مستخدم Mind Guard</div>
      <div class="profile-stats" id="profileStats">شريكك في العناية النفسية</div>
    </div>

    <div class="profile-menu">
      <div class="profile-menu-item" onclick="App.navigate('progress.html')">
        <div class="profile-menu-icon"><i class="fas fa-chart-line"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuProgress">التقدم والإحصائيات</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
      <div class="profile-menu-item" onclick="App.navigate('mood-check.html')">
        <div class="profile-menu-icon"><i class="fas fa-smile"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuNewAssessment">تقييم جديد</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
      <div class="profile-menu-item" onclick="App.navigate('aspects.html')">
        <div class="profile-menu-icon"><i class="fas fa-dumbbell"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuExercises">التمارين التفاعلية</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
      <div class="profile-menu-item" onclick="App.navigate('emotional-release.html')">
        <div class="profile-menu-icon"><i class="fas fa-book"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuEmotional">تفريغ المشاعر</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
      <div class="profile-menu-item" onclick="App.navigate('cbt.html')">
        <div class="profile-menu-icon"><i class="fas fa-brain"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuCbt">تحليل الأفكار (CBT)</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
      <div class="profile-menu-item" onclick="Storage.exportData()">
        <div class="profile-menu-icon"><i class="fas fa-download"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuExport">تصدير البيانات</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
      <div class="profile-menu-item" onclick="App.navigate('pricing.html')" style="color:#B8860B;">
        <div class="profile-menu-icon" style="background:#FFF3E0;color:#E8A838;"><i class="fas fa-crown"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuPricing">الباقات</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
      <div class="profile-menu-item" onclick="Storage.clearAll()" style="color:#F44336;">
        <div class="profile-menu-icon" style="background:#FFEBEE;color:#F44336;"><i class="fas fa-trash"></i></div>
        <div class="profile-menu-text" data-i18n="profile.menuClear">مسح جميع البيانات</div>
        <span class="profile-menu-arrow"><i class="fas fa-chevron-left"></i></span>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span data-i18n="nav.home">الرئيسية</span></a>
    <a href="progress.html"><i class="fas fa-chart-line"></i><span data-i18n="nav.progress">التقدم</span></a>
    <a href="mood-check.html"><i class="fas fa-plus-circle"></i><span data-i18n="nav.newAssessment">تقييم جديد</span></a>
    <a href="aspects.html"><i class="fas fa-dumbbell"></i><span data-i18n="nav.exercises">التمارين</span></a>
    <a href="profile.html" class="active"><i class="fas fa-user"></i><span data-i18n="nav.profile">الملف الشخصي</span></a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderProfile() {
      const assessments = Storage.getAssessments();
      const stats = Storage.getAverages();
      if (stats) {
        const isEn = i18n.lang === 'en';
        document.getElementById('profileStats').textContent = isEn
          ? 'Avg. Wellbeing: ' + stats.overall + '% | ' + assessments.length + ' assessments'
          : 'متوسط العافية: ' + stats.overall + '% | ' + assessments.length + ' تقييم';
      } else {
        document.getElementById('profileStats').textContent = i18n.t('profile.noAssessments');
      }
    }
    renderProfile();
  </script>
</body>
</html>
