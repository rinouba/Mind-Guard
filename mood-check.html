<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - كيف حالك اليوم؟</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page page-center blob-bg">
    <h1 class="page-title">كيف حالك اليوم؟</h1>
    <div class="mood-grid">
      <div class="mood-item" onclick="selectMood('excellent')">
        <div class="mood-circle">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="22" r="20" fill="rgba(91,140,133,0.1)"/>
            <circle cx="16" cy="18" r="2.5" fill="#5B8C85"/>
            <circle cx="28" cy="18" r="2.5" fill="#5B8C85"/>
            <path d="M13 26c0 0 3 6 9 6s9-6 9-6" stroke="#5B8C85" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M9 13l4 2M35 13l-4 2" stroke="#A8D5BA" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="mood-label">ممتاز</span>
      </div>
      <div class="mood-item" onclick="selectMood('good')">
        <div class="mood-circle">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="22" r="20" fill="rgba(91,140,133,0.06)"/>
            <circle cx="16" cy="18" r="2.5" fill="#5B8C85"/>
            <circle cx="28" cy="18" r="2.5" fill="#5B8C85"/>
            <path d="M15 28c0 0 2.5 4 7 4s7-4 7-4" stroke="#5B8C85" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          </svg>
        </div>
        <span class="mood-label">جيد</span>
      </div>
      <div class="mood-item" onclick="selectMood('neutral')">
        <div class="mood-circle">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="22" r="20" fill="rgba(91,140,133,0.04)"/>
            <circle cx="16" cy="18" r="2.5" fill="#7A8B87"/>
            <circle cx="28" cy="18" r="2.5" fill="#7A8B87"/>
            <path d="M15 28h14" stroke="#7A8B87" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="mood-label">متوسط</span>
      </div>
      <div class="mood-item" onclick="selectMood('bad')">
        <div class="mood-circle">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="22" r="20" fill="rgba(168,213,186,0.08)"/>
            <circle cx="16" cy="18" r="2.5" fill="#7A8B87"/>
            <circle cx="28" cy="18" r="2.5" fill="#7A8B87"/>
            <path d="M15 30c0 0 3-4 7-4s7 4 7 4" stroke="#7A8B87" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="mood-label">سيء</span>
      </div>
      <div class="mood-item" onclick="selectMood('very_bad')">
        <div class="mood-circle">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="22" r="20" fill="rgba(180,120,120,0.08)"/>
            <path d="M14 16.5c0 0 1-1.5 2.5-1.5s2.5 1.5 2.5 1.5" stroke="#8B6B6B" stroke-width="2" stroke-linecap="round"/>
            <path d="M25 16.5c0 0 1-1.5 2.5-1.5s2.5 1.5 2.5 1.5" stroke="#8B6B6B" stroke-width="2" stroke-linecap="round"/>
            <path d="M13 30c0 0 3.5-5 9-5s9 5 9 5" stroke="#8B6B6B" stroke-width="2" stroke-linecap="round"/>
            <path d="M22 6v3M22 35v3M6 22h3M35 22h3" stroke="#A8D5BA" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
          </svg>
        </div>
        <span class="mood-label">سيء جداً</span>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="progress.html"><i class="fas fa-chart-line"></i><span>التقدم</span></a>
    <a href="mood-check.html" class="active"><i class="fas fa-plus-circle"></i><span>تقييم جديد</span></a>
    <a href="aspects.html"><i class="fas fa-dumbbell"></i><span>التمارين</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span>الملف الشخصي</span></a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/app.js"></script>
  <script>
    function selectMood(mood) {
      Storage.saveMood(mood);
      App.navigate('aspects.html');
    }
  </script>
</body>
</html>
