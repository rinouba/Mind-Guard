<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - النتائج</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style-additions.css">
</head>
<body>
  <div id="alertBanner" class="alert-banner hidden">
    <div class="alert-banner-content">
      <span class="alert-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 4L3 20h18L12 4z" stroke="#E8A838" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(232,168,56,0.12)"/>
          <path d="M12 10v4M12 17v1" stroke="#E8A838" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="alert-text">
        <div class="alert-title" data-i18n="alert.title">تنبيه وقائي</div>
        <div class="alert-message" data-i18n="alert.message">مؤشرات الإجهاد/القلق لديك مرتفعة اليوم. نوصي بالبدء فوراً بتمرين وقائي مخصص.</div>
      </div>
      <button class="alert-cta" onclick="App.navigate('emotional-release.html')" data-i18n="alert.cta">ابدأ التمرين الآن</button>
      <button class="alert-close" onclick="dismissAlert()">✕</button>
    </div>
  </div>
  <button class="lang-toggle-btn" onclick="i18n.toggle()">EN</button>
  <button class="theme-toggle-btn" onclick="App.toggleTheme()">🌙</button>
  <div class="page slide-up" style="padding-bottom:80px;">
    <div class="results-header">
      <div class="score-circle" id="scoreCircle" style="--pct: 0%;">
        <div class="score-circle-inner">
          <div class="score-value" id="scoreValue">0%</div>
          <div class="score-label" data-i18n="results.wellbeingLabel">نسبة العافية النفسية</div>
        </div>
      </div>
      <div id="scoreStatusText" class="score-status-text" style="text-align:center;padding:12px 20px 0;font-size:0.95rem;line-height:1.7;min-height:50px;transition:color 0.3s ease;"></div>
    </div>

    <div class="lowest-aspect-section" id="lowestSection">
      <div class="lowest-aspect-header">
        <span class="lowest-aspect-icon" id="lowestIcon"></span>
        <span class="lowest-aspect-name" id="lowestName">الجانب الفيزيولوجي</span>
        <span class="lowest-aspect-score" id="lowestScore">0%</span>
      </div>
      <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px;" data-i18n="results.recommendationsHeader">توصيات مخصصة لك:</div>
      <div id="recommendationsList"></div>
    </div>

    <div id="trendSection" class="trend-section" style="margin:20px 0;padding:16px 24px;border-radius:20px;background:var(--card-bg);border:1px solid var(--card-border);min-height:24px;display:none;transition:all 0.3s ease;">
      <div id="trendText" style="font-size:0.9rem;line-height:1.6;text-align:center;"></div>
    </div>

      <div class="results-actions">
        <button class="btn btn-primary btn-lg btn-block" id="exerciseBtn" data-i18n="results.exerciseBtn">ابدأ التمرين المناسب</button>
        <div id="cooldownBadgeContainer" style="text-align:center;margin-top:8px;min-height:24px;"></div>
        <button class="btn btn-secondary btn-lg btn-block" onclick="App.navigate('progress.html')" data-i18n="results.showProgress">عرض التقدم</button>
      </div>
    </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span data-i18n="nav.home">الرئيسية</span></a>
    <a href="progress.html"><i class="fas fa-chart-line"></i><span data-i18n="nav.progress">التقدم</span></a>
    <a href="mood-check.html"><i class="fas fa-plus-circle"></i><span data-i18n="nav.newAssessment">تقييم جديد</span></a>
    <a href="aspects.html"><i class="fas fa-dumbbell"></i><span data-i18n="nav.exercises">التمارين</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span data-i18n="nav.profile">الملف الشخصي</span></a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/exercises.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lowestAspectIndex = parseInt(params.get('aspect')) || 1;
    const overallScore = parseInt(params.get('overall')) || 0;

    const aspectSvgs = {
      1: '<svg width="40" height="40" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="24" fill="#F5F0E8"/><path d="M26 14c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(91,140,133,0.08)"/><path d="M16 38c0-5.5 4.5-10 10-10s10 4.5 10 10" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
      2: '<svg width="40" height="40" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="24" fill="#F5F0E8"/><circle cx="26" cy="26" r="10" stroke="#5B8C85" stroke-width="1.8" fill="none"/><circle cx="26" cy="26" r="4" fill="#5B8C85"/></svg>',
      3: '<svg width="40" height="40" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="24" fill="#F5F0E8"/><circle cx="20" cy="20" r="6" stroke="#5B8C85" stroke-width="1.8" fill="rgba(91,140,133,0.08)"/><circle cx="32" cy="20" r="6" stroke="#5B8C85" stroke-width="1.8" fill="rgba(91,140,133,0.08)"/><path d="M14 38c0-3.3 2.7-6 6-6" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M38 38c0-3.3-2.7-6-6-6" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M20 32c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
      4: '<svg width="40" height="40" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="24" fill="#F5F0E8"/><path d="M26 38s-10-6-10-13c0-3.3 2.7-6 6-6 2 0 3.8 1 4.9 2.5" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M26 38s10-6 10-13c0-3.3-2.7-6-6-6-2 0-3.8 1-4.9 2.5" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="rgba(91,140,133,0.08)"/></svg>',
      5: '<svg width="40" height="40" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="24" fill="#F5F0E8"/><path d="M18 30c0 4.4 3.6 8 8 8s8-3.6 8-8v-4c0-3.3-2.7-6-6-6h-4c-3.3 0-6 2.7-6 6v4z" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(91,140,133,0.08)"/></svg>'
    };

    var resultsTrans = {
      'results.status.good': { ar: 'المؤشرات الحالية تعكس مستوى جيداً من التوازن النفسي في هذا البعد', en: 'Current indicators reflect a good level of psychological balance in this aspect' },
      'results.status.moderate': { ar: 'تشير المؤشرات إلى وجود ضغط نفسي يستحق الانتباه، يُنصح بمتابعته', en: 'Indicators suggest notable psychological pressure, follow-up is recommended' },
      'results.status.low': { ar: 'تشير المؤشرات إلى مستوى مرتفع من الضغط النفسي، يُنصح بالتواصل مع مختص للحصول على دعم مناسب', en: 'Indicators show high psychological pressure, consulting a specialist is recommended' },
      'results.trend.up': { ar: 'لاحظنا تحسناً في البعد خلال الأسبوع الأخير، استمري على هذا المسار', en: 'We noticed improvement in this aspect over the past week, keep up the good work' },
      'results.trend.down': { ar: 'لاحظنا انخفاضاً في البعد مقارنة بالأسبوع السابق، قد يكون مفيداً التركيز على تمارين هذا الجانب', en: 'We noticed a decline compared to last week, consider focusing on this aspect\'s exercises' },
      'results.trend.stable': { ar: 'مستوى البعد مستقر، يمكنك المحافظة عليه بالتمارين المقترحة', en: 'This aspect\'s level is stable, maintain it with the suggested exercises' }
    };
    for (var k in resultsTrans) { if (!i18n.translations[k]) i18n.translations[k] = resultsTrans[k]; }

    function renderResults() {
      const rec = RECOMMENDATIONS[lowestAspectIndex];
      document.getElementById('lowestIcon').innerHTML = aspectSvgs[lowestAspectIndex] || '';
      document.getElementById('lowestName').textContent = i18n.getAspectName(lowestAspectIndex);
      document.getElementById('lowestScore').textContent = overallScore + '%';

      setTimeout(() => {
        document.getElementById('scoreCircle').style.setProperty('--pct', overallScore + '%');
      }, 200);
      document.getElementById('scoreValue').textContent = overallScore + '%';

      const list = document.getElementById('recommendationsList');
      list.innerHTML = '';
      const recs = i18n.getRecommendations(lowestAspectIndex);
      recs.forEach(r => {
        const div = document.createElement('div');
        div.className = 'recommendation-item';
        div.textContent = r;
        list.appendChild(div);
      });

      if (rec) {
        var exerciseBtn = document.getElementById('exerciseBtn');
        if (exerciseBtn) {
          exerciseBtn.onclick = function () {
            App.navigate(rec.exercise + '?aspect=' + lowestAspectIndex);
          };
        }
      }
    }

    function getStatusText(score) {
      if (score >= 70) return { key: 'results.status.good', color: '#4CAF50' };
      if (score >= 50) return { key: 'results.status.moderate', color: '#FFC107' };
      return { key: 'results.status.low', color: '#F44336' };
    }

    function getPreviousAspectScore(aspectIndex) {
      var aspectMap = { 1: 'physiological', 2: 'behavioral', 3: 'social', 4: 'emotional', 5: 'cognitive' };
      var key = aspectMap[aspectIndex];
      var assessments = Storage.getAssessments();
      if (assessments.length < 2) return null;
      for (var i = assessments.length - 2; i >= 0; i--) {
        if (assessments[i].scores && assessments[i].scores[key] !== undefined) {
          return assessments[i].scores[key];
        }
      }
      return null;
    }

    function getTrendText(diff) {
      if (diff >= 5) return { key: 'results.trend.up', color: '#4CAF50' };
      if (diff <= -5) return { key: 'results.trend.down', color: '#FFC107' };
      return { key: 'results.trend.stable', color: '#7A8B87' };
    }

    function renderStatusAndTrend() {
      var status = getStatusText(overallScore);
      var statusEl = document.getElementById('scoreStatusText');
      if (statusEl) {
        statusEl.textContent = i18n.t(status.key);
        statusEl.style.color = status.color;
      }
      var prevScore = getPreviousAspectScore(lowestAspectIndex);
      if (prevScore !== null) {
        var diff = overallScore - prevScore;
        var trend = getTrendText(diff);
        var trendSection = document.getElementById('trendSection');
        var trendEl = document.getElementById('trendText');
        if (trendEl && trendSection) {
          trendEl.textContent = i18n.t(trend.key);
          trendEl.style.color = trend.color;
          trendSection.style.display = 'block';
        }
      }
    }

    function checkAlertThreshold() {
      const dismissed = Storage.get('alertDismissed');
      if (dismissed === App.getTodayString()) return;

      let triggerAlert = overallScore <= 40;

      if (!triggerAlert) {
        const todayAssessments = Storage.getAssessments().filter(a => a.date === App.getTodayString());
        for (const a of todayAssessments) {
          for (const val of Object.values(a.scores)) {
            if (val <= 40) { triggerAlert = true; break; }
          }
          if (triggerAlert) break;
        }
      }

      if (triggerAlert) {
        document.getElementById('alertBanner').classList.remove('hidden');
      }
    }

    function dismissAlert() {
      Storage.set('alertDismissed', App.getTodayString());
      const banner = document.getElementById('alertBanner');
      banner.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      banner.style.opacity = '0';
      banner.style.transform = 'translateY(-100%)';
      setTimeout(() => banner.classList.add('hidden'), 300);
    }

    checkAlertThreshold();
    renderResults();
    renderStatusAndTrend();
  </script>
</body>
</html>
