<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - تفريغ المشاعر</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="emotional-screen">
    <h1 class="page-title text-center">🤲 تفريغ المشاعر</h1>
    <p class="page-subtitle text-center" style="margin-bottom:16px;font-size:0.95rem;color:var(--text-secondary);">
      اكتب ما في قلبك… هذا المساحة لك فقط
    </p>

    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <span style="font-size:1.5rem;">✍️</span>
        <span style="font-weight:700;font-size:1.05rem;">ماذا تشعر الآن؟</span>
      </div>
      <textarea id="releaseTextarea"
        placeholder="اكتب هنا بحرية… لا تتردد، أنت في مساحة آمنة"
        style="height:220px;border-radius:20px;background:#FAF9F6;"></textarea>

      <div style="display:flex;gap:12px;margin-top:16px;">
        <button class="btn btn-primary btn-block btn-lg" onclick="releaseFeelings()">
          <i class="fas fa-cloud-sun"></i> تفريغ المشاعر
        </button>
        <button class="btn btn-secondary" onclick="clearRelease()" style="padding:14px 18px;">
          <i class="fas fa-eraser"></i>
        </button>
      </div>
    </div>

    <div class="card" style="text-align:center;">
      <p style="font-size:0.95rem;color:var(--text-secondary);margin-bottom:12px;">
        أو اختر شعورك الحالي
      </p>
      <div class="mood-selector">
        <div class="mood-selector-item" onclick="selectReleaseMood(this, 'قلق')">
          <span class="mood-selector-icon">😰</span>
          <span class="mood-selector-label">قلق</span>
        </div>
        <div class="mood-selector-item" onclick="selectReleaseMood(this, 'حزن')">
          <span class="mood-selector-icon">😢</span>
          <span class="mood-selector-label">حزن</span>
        </div>
        <div class="mood-selector-item" onclick="selectReleaseMood(this, 'فرح')">
          <span class="mood-selector-icon">😊</span>
          <span class="mood-selector-label">فرح</span>
        </div>
      </div>
    </div>
  </div>

  <div id="modalContainer"></div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="progress.html"><i class="fas fa-chart-line"></i><span>التقدم</span></a>
    <a href="mood-check.html"><i class="fas fa-plus-circle"></i><span>تقييم جديد</span></a>
    <a href="aspects.html" class="active"><i class="fas fa-dumbbell"></i><span>التمارين</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span>الملف الشخصي</span></a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/app.js"></script>
  <script>
    let selectedMood = '';

    function selectReleaseMood(el, mood) {
      document.querySelectorAll('.mood-selector-item').forEach(item => item.classList.remove('selected'));
      el.classList.add('selected');
      selectedMood = mood;
      document.getElementById('releaseTextarea').placeholder =
        mood === 'قلق' ? 'حدثني عن ما يقلقك…' :
        mood === 'حزن' ? 'شاركني ما يحزن قلبك…' :
        'أخبرني عن سبب فرحك اليوم…';
      document.getElementById('releaseTextarea').focus();
    }

    function releaseFeelings() {
      const text = document.getElementById('releaseTextarea').value.trim();
      if (!text && !selectedMood) {
        showModal('🤔', 'اكتب شيئاً', 'اكتب ما تشعر به أو اختر شعورك أولاً');
        return;
      }

      const moodText = selectedMood ? `شعورك: ${selectedMood}` : '';
      const msg = text
        ? `تم تفريغ مشاعرك بنجاح 🌿\n${moodText}`
        : `تم تسجيل شعورك: ${selectedMood} 🌿`;

      showModal('🌿', 'تم تفريغ المشاعر', msg + '\n\nأنت بخير، ونحن هنا لأجلك 💚');
      document.getElementById('releaseTextarea').value = '';
      selectedMood = '';
      document.querySelectorAll('.mood-selector-item').forEach(item => item.classList.remove('selected'));
      document.getElementById('releaseTextarea').placeholder = 'اكتب هنا بحرية… لا تتردد، أنت في مساحة آمنة';
    }

    function clearRelease() {
      document.getElementById('releaseTextarea').value = '';
      selectedMood = '';
      document.querySelectorAll('.mood-selector-item').forEach(item => item.classList.remove('selected'));
    }

    function showModal(icon, title, desc) {
      const container = document.getElementById('modalContainer');
      container.innerHTML = `
        <div class="modal-overlay" onclick="closeModal(event)">
          <div class="modal-box" onclick="event.stopPropagation()">
            <span class="modal-icon">${icon}</span>
            <div class="modal-title">${title}</div>
            <div class="modal-desc" style="white-space:pre-line;">${desc}</div>
            <button class="btn btn-primary modal-btn" onclick="closeModal()">حسناً</button>
          </div>
        </div>
      `;
    }

    function closeModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modalContainer').innerHTML = '';
    }
  </script>
</body>
</html>
