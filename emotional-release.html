<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - التحرر العاطفي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="emotional-screen">
    <h1 class="page-title text-center">اكتب ما تشعر به الآن بحرية تامة</h1>
    <p class="page-subtitle text-center" style="margin-bottom:16px;font-size:0.9rem;color:var(--text-secondary);">
      هذا الفضاء خاص بك فقط، لا يراه أحد
    </p>

    <div class="prompt-chips">
      <span class="prompt-chip" onclick="addPrompt('ما الذي يزعجك حالياً؟')">ما الذي يزعجك حالياً؟</span>
      <span class="prompt-chip" onclick="addPrompt('كيف يؤثر هذا على مشاعرك؟')">كيف يؤثر هذا على مشاعرك؟</span>
      <span class="prompt-chip" onclick="addPrompt('ما الذي تتمنى أن يتغير؟')">ما الذي تتمنى أن يتغير؟</span>
    </div>

    <textarea class="emotional-textarea" id="journalTextarea"
      placeholder="لا تفكر في القواعد أو الإملاء، فقط اكتب..."
      oninput="updateWordCounter()"></textarea>

    <div class="word-counter" id="wordCounter">0 كلمة</div>

    <div style="display:flex;gap:12px;margin-top:16px;">
      <button class="btn btn-primary btn-block" onclick="saveJournal()">
        <i class="fas fa-save"></i> حفظ في اليوميات
      </button>
      <button class="btn btn-secondary" onclick="clearJournal()">
        <i class="fas fa-eraser"></i> مسح
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="progress.html"><i class="fas fa-chart-line"></i><span>التقدم</span></a>
    <a href="mood-check.html"><i class="fas fa-plus-circle"></i><span>تقييم جديد</span></a>
    <a href="aspects.html" class="active"><i class="fas fa-dumbbell"></i><span>التمارين</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span>الملف الشخصي</span></a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/app.js"></script>
  <script>
    function updateWordCounter() {
      const text = document.getElementById('journalTextarea').value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('wordCounter').textContent = words + ' كلمة';
    }

    function addPrompt(prompt) {
      const ta = document.getElementById('journalTextarea');
      ta.value += '\n' + prompt + '\n';
      updateWordCounter();
    }

    function saveJournal() {
      const content = document.getElementById('journalTextarea').value.trim();
      if (!content) {
        return;
      }
      Storage.saveJournalEntry(content);
      document.getElementById('journalTextarea').value = '';
      updateWordCounter();
    }

    function clearJournal() {
      document.getElementById('journalTextarea').value = '';
      updateWordCounter();
    }
  </script>
</body>
</html>
