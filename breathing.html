<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - تمرين التنفس</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="lang-toggle-btn" onclick="i18n.toggle()">EN</button>
  <button class="theme-toggle-btn" onclick="App.toggleTheme()">🌙</button>
  <div class="breathing-screen" id="breathingScreen">
    <div class="breathing-circle" id="breathingCircle">
      <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
        <path d="M30 10C18.95 10 10 18.95 10 30s8.95 20 20 20 20-8.95 20-20S41.05 10 30 10z" fill="rgba(255,255,255,0.3)"/>
      </svg>
    </div>
    <div class="breathing-instruction" id="breathingInstruction">تنفس ببطء من الأنف</div>
    <div class="breathing-counter" id="breathingCounter">الدورة 1 من 4</div>
    <button class="btn btn-primary btn-lg" id="breathingEndBtn" onclick="endBreathing()" style="display:none;"><span data-i18n="breathing.endBtn">إنهاء التمرين</span></button>
    <button class="btn btn-secondary" id="breathingStartBtn" onclick="startBreathing()"><span data-i18n="breathing.startBtn">ابدأ التمرين</span></button>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    let breathingInterval = null;
    let currentPhase = 0;
    let currentCycle = 0;

    function getPhases() {
      if (i18n.lang === 'en') {
        return [
          { text: 'Breathe in slowly through your nose', css: 'inhale', duration: 4000 },
          { text: 'Hold your breath', css: 'hold', duration: 4000 },
          { text: 'Exhale slowly', css: 'exhale', duration: 4000 },
          { text: 'Hold your breath', css: 'hold', duration: 4000 }
        ];
      }
      return [
        { text: 'تنفس ببطء من الأنف', css: 'inhale', duration: 4000 },
        { text: 'احبس النفس', css: 'hold', duration: 4000 },
        { text: 'أخرج الهواء ببطء', css: 'exhale', duration: 4000 },
        { text: 'احبس النفس', css: 'hold', duration: 4000 }
      ];
    }
    const totalCycles = 4;

    function startBreathing() {
      document.getElementById('breathingStartBtn').style.display = 'none';
      document.getElementById('breathingEndBtn').style.display = 'block';
      currentCycle = 1;
      currentPhase = 0;
      runPhase();
    }

    function runPhase() {
      const phases = getPhases();
      const phase = phases[currentPhase];
      const circle = document.getElementById('breathingCircle');
      const instruction = document.getElementById('breathingInstruction');

      circle.className = 'breathing-circle ' + phase.css;
      instruction.textContent = phase.text;
      document.getElementById('breathingCounter').textContent = i18n.t('breathing.cycle').replace('{n}', currentCycle).replace('{total}', totalCycles);

      if (breathingInterval) clearTimeout(breathingInterval);
      breathingInterval = setTimeout(() => {
        currentPhase++;
        if (currentPhase >= phases.length) {
          currentPhase = 0;
          currentCycle++;
          if (currentCycle > totalCycles) {
            endBreathing();
            return;
          }
        }
        runPhase();
      }, phase.duration);
    }

    function endBreathing() {
      if (breathingInterval) clearTimeout(breathingInterval);
      document.getElementById('breathingInstruction').textContent = i18n.t('breathing.wellDone');
      document.getElementById('breathingCounter').textContent = '';
      document.getElementById('breathingCircle').className = 'breathing-circle';
      document.getElementById('breathingEndBtn').style.display = 'none';
      const params = new URLSearchParams(window.location.search);
      const aspect = params.get('aspect') || 1;
      setTimeout(() => App.navigate('results.html?aspect=' + aspect + '&overall=50'), 2000);
    }

    function startBreathing() {
      document.getElementById('breathingStartBtn').style.display = 'none';
      document.getElementById('breathingEndBtn').style.display = 'block';
      currentCycle = 1;
      currentPhase = 0;
      runPhase();
    }
  </script>
</body>
</html>
