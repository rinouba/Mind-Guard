<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="حارس عقلك - شريكك في العناية النفسية">
  <meta name="theme-color" content="#5B8C85">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MindGuard">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
  <title>Mind Guard - حارس عقلك</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="splash-screen">
    <button class="lang-toggle-btn" onclick="i18n.toggle()">EN</button>
    <button class="theme-toggle-btn" onclick="App.toggleTheme()">🌙</button>
    <div class="splash-logo">
      <img src="icons/logo.jpg" alt="Mind Guard">
    </div>
    <h1 class="splash-title" data-i18n-html="hero.title">
      منصة MindGuard<br><span>المنصة الرقمية لتحليل المؤشرات السلوكية والتنبؤ باضطرابات القلق، الاكتئاب، والإجهاد النفسي</span></h1>
    <p class="splash-quote" data-i18n="hero.subtitle">نظام رصد خماسي الأبعاد (معرفي، سلوكي، انفعالي، اجتماعي، وفيزيولوجي) يعتمد على التقييم الذاتي الرقمي لتقديم إنذار نفسي استباقي، وحماية خصوصيتك بالكامل دون الحاجة لتسجيل دخول.</p>
    <button class="btn btn-primary btn-lg" id="startJourneyBtn" data-i18n="index.startBtn">ابدأ الرحلة</button>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
