<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - اقتباس تحفيزي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="lang-toggle-btn" onclick="i18n.toggle()">EN</button>
  <div class="quote-screen">
    <div class="quote-bg"></div>
    <div class="quote-card fade-in">
      <div class="quote-icon" style="margin-bottom:16px;">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" fill="#F5F0E8"/>
          <path d="M15 20c0 0 3-4 7-2v4c-2 1-4 3-4 6" stroke="#5B8C85" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M26 20c0 0 3-4 7-2v4c-2 1-4 3-4 6" stroke="#5B8C85" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="quote-text" id="quoteText">اعتنِ بجسدك، فهو المسكن الوحيد لروحك.</div>
      <div class="quote-author" id="quoteAuthor" style="margin-bottom:24px;"></div>
      <button class="btn btn-primary btn-lg btn-block" onclick="startAssessment()" data-i18n="quote.startBtn">ابدأ التقييم</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const aspect = parseInt(params.get('aspect')) || 1;

    function renderQuote() {
      document.getElementById('quoteText').textContent = i18n.getQuote(aspect);
    }

    function startAssessment() {
      App.navigate('questionnaire.html?aspect=' + aspect);
    }

    document.addEventListener('DOMContentLoaded', renderQuote);
  </script>
</body>
</html>
