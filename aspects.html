<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - الجوانب الخمسة للعافية</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page blob-bg" style="padding: 40px 20px 80px;">
    <h1 class="page-title text-center">الجوانب الخمسة للعافية</h1>
    <p class="page-subtitle text-center">اختر الجانب الذي تريد تقييمه</p>
    <div class="aspect-grid">
      <div class="aspect-card" onclick="App.navigate('quote-display.html?aspect=1')">
        <div class="aspect-icon">💪</div>
        <div class="aspect-name">الجانب الفيزيولوجي</div>
        <div class="aspect-desc">الجسم والطاقة</div>
      </div>
      <div class="aspect-card" onclick="App.navigate('quote-display.html?aspect=2')">
        <div class="aspect-icon">🎯</div>
        <div class="aspect-name">الجانب السلوكي</div>
        <div class="aspect-desc">الأفعال والإنجاز</div>
      </div>
      <div class="aspect-card" onclick="App.navigate('quote-display.html?aspect=3')">
        <div class="aspect-icon">👥</div>
        <div class="aspect-name">الجانب الاجتماعي</div>
        <div class="aspect-desc">العلاقات والدعم</div>
      </div>
      <div class="aspect-card" onclick="App.navigate('quote-display.html?aspect=4')">
        <div class="aspect-icon">💚</div>
        <div class="aspect-name">الجانب الانفعالي</div>
        <div class="aspect-desc">المشاعر والهدوء</div>
      </div>
      <div class="aspect-card" onclick="App.navigate('quote-display.html?aspect=5')">
        <div class="aspect-icon">🧠</div>
        <div class="aspect-name">الجانب المعرفي</div>
        <div class="aspect-desc">الأفكار والقرارات</div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="progress.html"><i class="fas fa-chart-line"></i><span>التقدم</span></a>
    <a href="mood-check.html"><i class="fas fa-plus-circle"></i><span>تقييم جديد</span></a>
    <a href="aspects.html" class="active"><i class="fas fa-dumbbell"></i><span>التمارين</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span>الملف الشخصي</span></a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
