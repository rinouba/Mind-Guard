<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8C85">
  <title>Mind Guard - الجوانب الخمسة للعافية</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style-additions.css">
</head>
<body>
  <button class="lang-toggle-btn" onclick="i18n.toggle()">EN</button>
  <button class="theme-toggle-btn" onclick="App.toggleTheme()">🌙</button>
  <div class="page blob-bg" style="padding: 40px 20px 80px;">
    <h1 class="page-title text-center" data-i18n="aspects.title">الجوانب الخمسة للعافية</h1>
    <p class="page-subtitle text-center" data-i18n="aspects.subtitle">اختر الجانب الذي تريد تقييمه</p>
    <div class="aspect-grid">
      <div class="aspect-card" id="aspectCard1" onclick="handleAspectClick(1)">
        <div class="aspect-icon">
          <svg width="64" height="64" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="24" fill="#F5F0E8"/>
            <path d="M26 14c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(91,140,133,0.08)"/>
            <path d="M16 38c0-5.5 4.5-10 10-10s10 4.5 10 10" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M32 20l-6 8-4-4" stroke="#A8D5BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="aspect-name" data-i18n="aspect.physiological">الجانب الفيزيولوجي</div>
        <div class="aspect-desc" data-i18n="aspects.subtitle1">الجسم والطاقة</div>
        <div class="cooldown-aspect-badge" id="cooldownBadge1"></div>
      </div>
      <div class="aspect-card" id="aspectCard2" onclick="handleAspectClick(2)">
        <div class="aspect-icon">
          <svg width="64" height="64" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="24" fill="#F5F0E8"/>
            <circle cx="26" cy="26" r="10" stroke="#5B8C85" stroke-width="1.8" fill="none"/>
            <circle cx="26" cy="26" r="4" fill="#5B8C85" stroke="none"/>
            <path d="M26 6v6M26 40v6M6 26h6M40 26h6" stroke="#5B8C85" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
            <path d="M36 16l-8 10" stroke="#A8D5BA" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="aspect-name" data-i18n="aspect.behavioral">الجانب السلوكي</div>
        <div class="aspect-desc" data-i18n="aspects.subtitle2">الأفعال والإنجاز</div>
        <div class="cooldown-aspect-badge" id="cooldownBadge2"></div>
      </div>
      <div class="aspect-card" id="aspectCard3" onclick="handleAspectClick(3)">
        <div class="aspect-icon">
          <svg width="64" height="64" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="24" fill="#F5F0E8"/>
            <circle cx="18" cy="20" r="6" stroke="#5B8C85" stroke-width="1.8" fill="rgba(91,140,133,0.08)"/>
            <circle cx="34" cy="20" r="6" stroke="#5B8C85" stroke-width="1.8" fill="rgba(91,140,133,0.08)"/>
            <path d="M10 40c0-4.4 3.6-8 8-8" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M42 40c0-4.4-3.6-8-8-8" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M18 32c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M26 16v-2" stroke="#A8D5BA" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="aspect-name" data-i18n="aspect.social">الجانب الاجتماعي</div>
        <div class="aspect-desc" data-i18n="aspects.subtitle3">العلاقات والدعم</div>
        <div class="cooldown-aspect-badge" id="cooldownBadge3"></div>
      </div>
      <div class="aspect-card" id="aspectCard4" onclick="handleAspectClick(4)">
        <div class="aspect-icon">
          <svg width="64" height="64" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="24" fill="#F5F0E8"/>
            <path d="M26 38s-10-6-10-13c0-3.3 2.7-6 6-6 2 0 3.8 1 4.9 2.5" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M26 38s10-6 10-13c0-3.3-2.7-6-6-6-2 0-3.8 1-4.9 2.5" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="rgba(91,140,133,0.08)"/>
            <path d="M19 24l4 4 6-6" stroke="#A8D5BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="aspect-name" data-i18n="aspect.emotional">الجانب الانفعالي</div>
        <div class="aspect-desc" data-i18n="aspects.subtitle4">المشاعر والهدوء</div>
        <div class="cooldown-aspect-badge" id="cooldownBadge4"></div>
      </div>
      <div class="aspect-card" id="aspectCard5" onclick="handleAspectClick(5)">
        <div class="aspect-icon">
          <svg width="64" height="64" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="24" fill="#F5F0E8"/>
            <path d="M32 16c-2.2 0-4 1.3-4.8 3.2" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M20 16c2.2 0 4 1.3 4.8 3.2" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M18 28c0 4.4 3.6 8 8 8s8-3.6 8-8v-4c0-3.3-2.7-6-6-6h-4c-3.3 0-6 2.7-6 6v4z" stroke="#5B8C85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(91,140,133,0.08)"/>
            <path d="M22 24s2 2 4 2 4-2 4-2" stroke="#A8D5BA" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 32l3-1M29 31l3 1" stroke="#5B8C85" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          </svg>
        </div>
        <div class="aspect-name" data-i18n="aspect.cognitive">الجانب المعرفي</div>
        <div class="aspect-desc" data-i18n="aspects.subtitle5">الأفكار والقرارات</div>
        <div class="cooldown-aspect-badge" id="cooldownBadge5"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span data-i18n="nav.home">الرئيسية</span></a>
    <a href="progress.html"><i class="fas fa-chart-line"></i><span data-i18n="nav.progress">التقدم</span></a>
    <a href="mood-check.html"><i class="fas fa-plus-circle"></i><span data-i18n="nav.newAssessment">تقييم جديد</span></a>
    <a href="aspects.html" class="active"><i class="fas fa-dumbbell"></i><span data-i18n="nav.exercises">التمارين</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span data-i18n="nav.profile">الملف الشخصي</span></a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/exercises.js"></script>
  <script>
    function handleAspectClick(aspectNum) {
      App.navigate('quote-display.html?aspect=' + aspectNum);
    }

    document.addEventListener('DOMContentLoaded', function () {
      for (var i = 1; i <= 5; i++) {
        try {
          var badgeEl = document.getElementById('cooldownBadge' + i);
          if (badgeEl && Exercises.isExerciseLocked(i)) {
            var badge = document.createElement('span');
            badge.className = 'cooldown-badge';
            var remaining = Exercises.getCooldownTimeString(i);
            if (i18n && i18n.t) { badge.textContent = i18n.t('exercise.cooldown.locked') + (remaining ? ' (' + remaining + ')' : ''); }
            else { badge.textContent = 'مقفل 24 ساعة' + (remaining ? ' (' + remaining + ')' : ''); }
            badgeEl.appendChild(badge);
            var card = document.getElementById('aspectCard' + i);
            if (card) card.classList.add('aspect-card-disabled');
          }
        } catch(e) { /* skip if error */ }
      }
    });
  </script>
</body>
</html>
